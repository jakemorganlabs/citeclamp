name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run types
      - run: npm run lint

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Compute subject digest
        id: digest
        run: echo "sha256=$(printf '%s' '${{ github.sha }}' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: citeclamp
          subject-digest: sha256:${{ steps.digest.outputs.sha256 }}
          push-to-registry: false
