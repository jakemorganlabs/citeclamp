name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run types
      - run: npm run lint
      - name: Fixture CLI seals the example draft
        run: npm run seal -- examples/draft_pass.json examples/evidence.json
      - name: Executor refuses without a permit and runs with one
        run: |
          npm run seal -- examples/draft_send_email.json examples/evidence.json > sealed.json
          npm run execute -- sealed.json
      - name: Boot the server with the native strip-types hook and smoke /seal
        env:
          HMAC_SECRET: ci-smoke-secret
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf 127.0.0.1:8787/health && break; sleep 0.5; done
          bash scripts/smoke_seal.sh | tee smoke.out
          grep -q '"sealed":true' smoke.out
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:8787/seal -d '{}')
          test "$code" = "401"
          kill %1
